name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest

      - name: Run mypy
        # Each exercise is a standalone script, and many share the same
        # basename (exercise.py, solution.py, ...) across numbered chapter
        # folders, so checking them all in one mypy invocation fails with
        # "Duplicate module named" — check one file at a time instead.
        run: |
          uv run bash -c '
            find src -name "*.py" ! -path "*/.venv/*" ! -name "__init__.py" -print0 |
              xargs -0 -n1 -P4 mypy --ignore-missing-imports --no-incremental
          '

      - name: Run ruff check
        run: uv run ruff check src

      - name: Run ruff format check
        run: uv run ruff format --check src
